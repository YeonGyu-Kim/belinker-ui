name: Publish

run-name: Publish ${{ inputs.version || inputs.bump }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 올릴 버전 단계
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: 발행될 버전
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@yeongyu-kim'

      - run: npm ci

      - run: npm run build

      - name: Bump version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LOCAL="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view @yeongyu-kim/ui version)"
          echo "package.json ${LOCAL}, GitHub Packages ${PUBLISHED}"
          BASE="$(node -e '
            const [local, published] = process.argv.slice(1);
            const cmp = local.split(".").map(Number).reduce((result, part, index) => {
              return result || Math.sign(part - Number(published.split(".")[index]));
            }, 0);
            console.log(cmp >= 0 ? local : published);
          ' "$LOCAL" "$PUBLISHED")"
          if [ "$BASE" != "$LOCAL" ]; then
            npm pkg set "version=${BASE}"
          fi
          npm version ${{ inputs.bump }} --no-git-tag-version
          echo "next $(node -p "require('./package.json').version")"

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          VERSION="$(node -p "require('./package.json').version")"
          git commit -m "Release ${VERSION}"
          git push
